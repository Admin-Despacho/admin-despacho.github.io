name: Improve Approved Images
on:
  push:
    branches: [fix/checkpoint36-image-sharpness]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/improve-login-images.py
      - name: Commit processed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/branding/desktop-approved.webp public/branding/truck-approved.webp
          git commit -m "assets: sharpen approved desktop and Android artwork"
          git push
