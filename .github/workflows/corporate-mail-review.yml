name: Corporate mail review without deployment
on:
  push:
    branches: ["work/corporate-mail-20261116", "work/consolidado-correo-alarma-20261118"]
permissions:
  contents: read
jobs:
  unit_and_edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx vitest run
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - name: Check four Edge entrypoints
        run: deno check --frozen --config supabase/functions/deno.json supabase/functions/comm-dispatcher/index.ts supabase/functions/internal-approvals/index.ts supabase/functions/commercial-reports/index.ts supabase/functions/password-recovery/index.ts
  feature_regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright==1.51.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium
      - run: npx vite build --outDir dist-demo
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
      - name: Mobile commercial mail settings (demo)
        run: python tests/e2e/run_corporate_mail_ui.py dist-demo
      - name: Alarm from commercial authorization
        run: python tests/e2e/run_com_alarma_solicitud.py dist-demo
      - name: Alarm from REVISAR regression
        run: python tests/e2e/run_com_alarma.py dist-demo
      - name: Installment calendar regression
        run: python tests/e2e/run_com_cuotas.py dist-demo
  logout_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright==1.51.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium
      - run: npx vite build --outDir dist-demo
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
      - name: Logout regression
        run: python tests/e2e/run_cierre_sesion.py dist-demo
  production_artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install production artifact verifier
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://uqwilzzeyfuatlmwzxna.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_cwLs4qzUgtMuEDEEhsQSfg_n-Q9McXG
        run: npm run build
      - run: node scripts/verify_production_build.mjs dist https://uqwilzzeyfuatlmwzxna.supabase.co
      - run: node scripts/verify_production_carrier_flow.mjs --dist
