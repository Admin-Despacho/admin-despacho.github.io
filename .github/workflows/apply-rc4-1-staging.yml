name: Apply RC4.1 staging patch
on:
  push:
    branches: [rc4-1-staging-publish]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited RC4.1 patch
        run: |
          git apply --binary --index .rc4_1_full.patch
          rm .rc4_1_full.patch
          rm .github/workflows/apply-rc4-1-staging.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RC4.1 roles scope email CID"
          git push origin HEAD:rc4-1-staging-publish
