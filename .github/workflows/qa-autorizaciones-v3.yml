name: Certificar autorizaciones V3
on:
  push:
    branches: [qa/autorizaciones-visual-v3]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci && npm test && npm run build
      - run: pip install playwright openpyxl && python -m playwright install --with-deps chromium
      - run: python tests/e2e/run_com_seguimiento_v2.py dist
      - if: always()
        run: python tests/e2e/run_com_seguimiento_visual.py dist
  regresiones:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        revision: [candidata, base]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && '50866a7cc863cfdb2fe35ad45e24195cb3d95529' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: pip install playwright openpyxl && python -m playwright install --with-deps chromium
      - name: Suites E2E del módulo y general
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          failed=0
          for suite in run_com_cuotas run_com_circuito run_com_alarma run_com_consultar_aprobacion run_com_v4 run_e2e; do
            python "tests/e2e/$suite.py" dist || failed=1
          done
          exit "$failed"
