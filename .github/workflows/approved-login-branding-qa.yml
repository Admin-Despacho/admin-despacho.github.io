name: Approved Icon and Login QA (no deploy)
on:
  push:
    branches: [feat/approved-login-branding-icon]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/unit/driver-offline.test.js tests/unit/supabase-api.test.js
      - name: Validate seven icons and mobile-friendly interface
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for(const name of ['icon-16','icon-32','icon-192','icon-512','icon-maskable-192','icon-maskable-512','apple-touch-icon']){
            const data=fs.readFileSync('dist/icons/'+name+'.png');
            assert.equal(data.subarray(0,8).toString('hex'),'89504e470d0a1a0a',name);
            assert(data.length>60,name);
          }
          const html=fs.readFileSync('src/online/auth-ui.js','utf8');
          assert(html.includes('APP DESPACHO'));assert(html.includes('OK ACCESORIOS'));
          assert(!html.includes('Continuar con Google'));
          console.log('PASS: seven PNG icons, responsive branding, no Google login');
          JS
