name: Deploy OK Despacho RC4.1.2 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-vite"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: https://uqwilzzeyfuatlmwzxna.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_cwLs4qzUgtMuEDEEhsQSfg_n-Q9McXG
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Jekyll Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "Waiting for the legacy 'pages build and deployment' run for $SHA so the Vite deployment is always last."
          for i in $(seq 1 60); do
            RUN=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" --jq '.workflow_runs[] | select(.name=="pages build and deployment") | .id' | head -n1)
            if [ -z "$RUN" ]; then
              sleep 2
              continue
            fi
            STATUS=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.status')
            CONCLUSION=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.conclusion // ""')
            echo "legacy run $RUN: $STATUS $CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            sleep 3
          done

      - name: Deploy Vite build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
