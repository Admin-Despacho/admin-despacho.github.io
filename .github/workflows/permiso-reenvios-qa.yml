name: Permiso y reenvios QA
on:
  push:
    branches: [main, release/permiso-reenvios-20261028]
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Test both migrations together with G2 regression
        env:
          SQL_TESTS: g2_revision_test permiso_asignacion_test reenvios_test
          SKIP_CONCURRENCY: '1'
        run: bash tests/sql/run.sh
  app:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [run_cambiar_rol, run_cambiar_rol_revision, run_revocacion_admin, run_agregar_parada_refresco, run_reenvios_constructor, run_reenvios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PDF test dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx vitest run tests/unit/permiso-asignacion.test.js tests/unit/report-reenvios.test.js tests/unit/report-cristian-pdf.test.js tests/unit/report-loader.test.js tests/unit/report-cristian-publicadas.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0 openpyxl==3.1.5
      - run: python -m playwright install --with-deps chromium
      - name: Build demo for synthetic tests
        run: npx vite build --outDir dist-demo
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
      - name: Test roles and retries through UI
        run: |
          python tests/e2e/generate_synthetic_saldo_noc.py /tmp/okd_synth_saldo
          python tests/e2e/${{ matrix.suite }}.py dist-demo
